# Capstone manifest. Commands run from the repo root after `cp .env.example .env`.
name: Embeddable-Widget-Lead-Capture-Platform
repo: https://github.com/elyasbromand/Embeddable-Widget-Lead-Capture-Platform
requires: [node >= 22, docker]

# API on :3000 and the email worker, after Postgres + Mailpit and the migrations.
run: docker compose up -d --wait && npm ci && npm run migrate up && npm run start:all
# Two demo tenants (password demo-password-123) with fixed widget ids lvuvcZeFr-42 and cqaxksTr2jOc.
seed: npm run seed
# 98 tests on a fresh <db>_test database; no network.
test: npm test
base_url: http://localhost:3000

# Second origin for the browser probes: `npm run test-site` → http://localhost:5500
# Caught emails: http://localhost:8025 (Mailpit)

endpoints:
  public:
    - GET /health
    - GET /widget.js?id=lvuvcZeFr-42                 # loader, max-age=300
    - GET /widget.<hash>.js                          # bundle, immutable (URL is in the loader)
    - GET /widgets/lvuvcZeFr-42/config               # CORS *, max-age=60, ETag
    - OPTIONS /submissions                           # preflight 204
    - POST /submissions                              # {"widgetId":"lvuvcZeFr-42","fields":{"email":"a@example.com"}}
  owner:                                             # Authorization: Bearer <token from /auth/login>
    - POST /auth/register
    - POST /auth/login
    - GET|POST /api/widgets
    - GET|PATCH|DELETE /api/widgets/:id
    - GET /api/submissions?widgetId=&limit=&cursor=
    - GET /api/stats/overview?days=

probes:
  1_valid_submission: POST /submissions → 201; row visible in GET /api/submissions as tenant A, not as tenant B
  2_bad_payloads: malformed JSON 400, >10 kB 413, text/plain 415, invalid field 422, unknown widget 404 (never 500)
  3_burst: node scripts/attack.js → 10 × 201, then 429 with Retry-After, then 201 after the window
  4_geo_fallback: GEO_TEST_IP=8.8.8.8 GEO_FORCE_DOWN=ip-api.com → geo from ipapi.co; both names → 201 with geo NULL
  5_email_failure: worker with FORCE_EMAIL_FAILURE=true → 201, row stored, 4 attempts, dead letter, ALERT
  6_spam: POST with "website":"http://spam" → 201, no row stored
