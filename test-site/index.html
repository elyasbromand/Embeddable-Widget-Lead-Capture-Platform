<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer site (port 5500)</title>
  <!-- A customer's own CSS, deliberately hostile. The widget lives in a shadow root, so none of
       this should reach it. If the form turns red, Comic Sans or 40px, isolation is broken. -->
  <style>
    body { font-family: Georgia, serif; margin: 40px; background: #fafafa; }
    * { color: crimson !important; }
    form, input, button, label, h2 { font-family: "Comic Sans MS", cursive !important; font-size: 40px !important; }
  </style>
</head>
<body>
  <h1>Someone else's website</h1>
  <p>This page is served from http://localhost:5500. The only thing it knows about us is the line below.</p>

  <script src="http://localhost:3000/widget.js?id=lvuvcZeFr-42"></script>
</body>
</html>
